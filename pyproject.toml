[project]
name = "ha-skolengo"
version = "0.2.0"
description = "Unofficial Home Assistant integration for Skolengo school ENT (homework, timetable, messages)"
requires-python = ">=3.14"

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
