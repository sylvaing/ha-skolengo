name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is an unofficial project, not affiliated with Kosmos or Skolengo. Please do not post your
        EduConnect login, password, tokens, or your children's names and data. Attach the integration
        diagnostics instead (they are redacted).
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: ent
    attributes:
      label: Your ENT and sign-in method
      description: e.g. Mon ENT Occitanie, EduConnect parent account
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
